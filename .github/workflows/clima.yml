# Renova a previsão (INMET + Open-Meteo) de hora em hora e publica clima.json junto do site estático.
name: clima
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clima
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar previsão
        run: python3 -I pesquisa/clima.py --so-json
      - name: Salvar se mudou
        run: |
          git config user.name "clima-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clima.json
          git diff --cached --quiet || git commit -m "clima: previsão $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
